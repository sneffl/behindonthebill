<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behind on the Bill</title>
<meta name="description" content="What your electric bill should be each month, the real chance of a shutoff, and what to do today if you're behind. Free, nothing you type is saved.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://behindonthebill.com/">
<meta property="og:title" content="Behind on the Bill">
<meta property="og:description" content="See what your electric bill should be, your real shutoff risk, and what to do today if you're behind.">
<meta property="og:image" content="https://behindonthebill.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1f5c4a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Archivo'; src: url('archivo.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { --paper: #eceee8; --ink: #1d211f; --dim: #5a615c; --accent: #1f5c4a; --extrude: #86b9a1; }
  @media (prefers-color-scheme: dark) { :root { --paper: #111412; --ink: #e5e8e2; --dim: #a2aaa3; --accent: #6cc29b; --extrude: #2e7556; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .waking { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; padding: 24px;
            background: var(--paper); border-top: 6px solid var(--accent); transition: opacity .4s ease; z-index: 2; }
  .waking.gone { opacity: 0; pointer-events: none; }
  .name { font-weight: 800; font-stretch: 112%; font-size: clamp(34px, 8vw, 56px); letter-spacing: -0.02em; line-height: 1;
          text-shadow: 1px 1px 0 var(--extrude), 2px 2px 0 var(--extrude), 3px 3px 0 var(--extrude), 4px 4px 0 var(--extrude); }
  .msg { color: var(--dim); font-size: 17px; margin: 0; }
  .bar { width: min(260px, 70vw); height: 6px; margin: 0 auto; border-radius: 3px; background: color-mix(in srgb, var(--accent) 18%, transparent); overflow: hidden; }
  .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .msg a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="waking" id="waking" role="status">
    <div class="name">Behind on the Bill</div>
    <div class="bar" aria-hidden="true"></div>
    <p class="msg">Loading. If nobody's used it in a while this takes up to 30 seconds.</p>
    <p class="msg" id="slow" hidden>Still going? <a href="https://hugogarcia.shinyapps.io/utility-risk-model/">Open it directly</a>.</p>
  </div>
  <iframe id="app" src="https://hugogarcia.shinyapps.io/utility-risk-model/" title="Behind on the Bill" allow="clipboard-write"></iframe>
  <noscript><p style="padding:24px">Open the tool at <a href="https://hugogarcia.shinyapps.io/utility-risk-model/">hugogarcia.shinyapps.io/utility-risk-model</a>.</p></noscript>
  <script>
    var w = document.getElementById('waking');
    document.getElementById('app').addEventListener('load', function () { setTimeout(function () { w.classList.add('gone'); }, 1500); });
    setTimeout(function () { document.getElementById('slow').hidden = false; }, 45000);
  </script>
</body>
</html>
